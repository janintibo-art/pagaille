name: Compiler APK et EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Générer projet Android
        run: flutter create --project-name pagaille --platforms android .
      - name: Installer dépendances
        run: flutter pub get
      - name: Compiler APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pagaille-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Activer Windows
        run: flutter config --enable-windows-desktop
      - name: Générer projet Windows
        run: flutter create --project-name pagaille --platforms windows .
      - name: Installer dépendances
        run: flutter pub get
      - name: Compiler EXE
        run: flutter build windows --release
      - name: Emballer EXE et DLL
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'pagaille-windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: pagaille-windows-exe
          path: pagaille-windows.zip
  papier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pagaille-imprimable
          path: imprimable/
